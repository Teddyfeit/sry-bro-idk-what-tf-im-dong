<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>brew hack download</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a10;
      --panel: rgba(18, 23, 34, 0.92);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f4f9;
      --muted: #8aa2c7;
      --accent: #7f5aff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(125, 90, 255, 0.16), transparent 28%),
                  radial-gradient(circle at 20% 20%, rgba(80, 255, 197, 0.08), transparent 22%),
                  linear-gradient(180deg, #05070c 0%, #090d15 52%, #06080f 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .stage {
      width: min(1120px, 100%);
      text-align: center;
      padding: 48px 32px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 32px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(24px);
    }

    .logo-frame {
      width: 152px;
      height: 152px;
      margin: 0 auto 32px;
      display: grid;
      place-items: center;
      border-radius: 34px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 24px 64px rgba(0, 0, 0, 0.25);
    }

    .logo-frame img {
      width: 88px;
      height: 88px;
      object-fit: contain;
    }

    .brand {
      font-size: clamp(2rem, 4vw, 4rem);
      letter-spacing: -0.04em;
      margin-bottom: 16px;
      font-weight: 800;
    }

    .brand span {
      color: var(--accent);
    }

    .subtitle {
      max-width: 720px;
      margin: 0 auto 40px;
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--muted);
    }

    .download-card {
      max-width: 620px;
      margin: 0 auto;
      padding: 36px 32px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .download-card p {
      margin-bottom: 28px;
      color: var(--muted);
      line-height: 1.9;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 200px;
      padding: 16px 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(127, 90, 255, 0.96), rgba(81, 181, 255, 0.92));
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      box-shadow: 0 18px 40px rgba(127, 90, 255, 0.22);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 50px rgba(127, 90, 255, 0.28);
    }

    .secondary {
      display: inline-flex;
      margin-top: 20px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="logo-frame">
      <img src="logo.png" alt="brew hack logo" />
    </div>
    <h1 class="brand">brew <span>hack</span></h1>
    <p class="subtitle">brew hack client ig</p>
    <div class="download-card">
      <p>idk bro sry</p>
      <a class="button" href="brew-hack.zip" download>Download brew hack</a>
      <div>
        <a class="button secondary" href="eindex.html">Back to Home</a>
      </div>
    </div>
  </main>
</body>
</html>
